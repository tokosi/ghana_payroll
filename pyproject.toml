[project]
name = "ghana_payroll"
authors = [
    { name = "Ghana Payroll Contributors", email = "support@example.com" }
]
description = "Ghana localisation for ERPNext payroll: monthly graduated PAYE, SSNIT and Provident Fund"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"
hrms = ">=15.0.0,<17.0.0"
